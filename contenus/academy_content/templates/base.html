<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ROS Academy{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/contenus/site.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="brand" href="/">ROS Academy</a>
    <nav>{% block nav %}<a href="/">Parcours</a><a href="/compte/resultats">Résultats</a><a href="/compte/">Mon compte</a>{% endblock %}</nav>
  </header>
  {% block banner %}{% endblock %}
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Formation ROS 2 en français, sur un vrai ROS 2 Humble dans votre navigateur.</footer>
  <script type="module" src="/static/contenus/site.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
