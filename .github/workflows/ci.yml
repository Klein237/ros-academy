name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r hub/requirements-dev.txt
      - run: cd hub && python -m pytest -v

  lab-ui:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: lab-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lab-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ros-lab:0.1.0 images/ros-lab
      - run: tests/image/test_image.sh

  integration:
    needs: [unit, lab-ui, image]
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r hub/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lab-ui/package-lock.json
      - name: Playwright
        working-directory: lab-ui
        run: npm ci && npx playwright install --with-deps chromium
      - run: docker build -t ros-lab:0.1.0 images/ros-lab
      - name: Secrets de test
        run: |
          {
            echo "DOMAIN=localhost"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JUPYTERHUB_CRYPT_KEY=$(openssl rand -hex 32)"
            echo "HUB_ADMIN_TOKEN=$(openssl rand -hex 32)"
          } > deploy/.env
      - run: cd deploy && docker compose up -d --build
      - run: scripts/wait_for_hub.sh
      - name: Suite principale
        run: |
          set -a; . deploy/.env; set +a
          cd tests/integration && python -m pytest -v -m "not limit and not cull"
      - name: Lab UI de bout en bout
        working-directory: lab-ui
        run: |
          set -a; . ../deploy/.env; set +a
          npx playwright test --grep-invert @limit
      - name: Capacité
        run: |
          set -a; . deploy/.env; set +a
          (cd deploy && ACTIVE_SERVER_LIMIT=2 docker compose up -d hub)
          scripts/wait_for_hub.sh
          (cd tests/integration && python -m pytest -v -m limit)
          cd lab-ui && npx playwright test --grep @limit
      - name: Inactivité
        run: |
          set -a; . deploy/.env; set +a
          (cd deploy && IDLE_TIMEOUT_SECONDS=90 docker compose up -d hub)
          scripts/wait_for_hub.sh
          cd tests/integration && python -m pytest -v -m cull
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: lab-ui/playwright-report
          retention-days: 7
      - if: failure()
        run: |
          docker ps -a
          docker logs hub
          docker logs deploy-caddy-1 || true
          for c in $(docker ps -aq --filter name=jupyter-); do docker logs "$c"; done
