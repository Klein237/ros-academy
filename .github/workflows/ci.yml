name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r hub/requirements-dev.txt -r contenus/requirements-dev.txt -r comptes/requirements-dev.txt -r veille/requirements-dev.txt
      - run: cd hub && python -m pytest -v
      - run: cd contenus && python -m pytest -v
      - run: cd comptes && python -m pytest -v
      - run: cd veille && python -m pytest -v
      - run: shellcheck -S warning scripts/*.sh tests/scripts/*.sh
      - run: bash tests/scripts/test_installer.sh

  lab-ui:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: lab-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lab-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ros-lab:0.1.0 images/ros-lab
      - run: tests/image/test_image.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r contenus/requirements-dev.txt
      - name: Testeur de modules et vérification des exercices (conteneur ROS réel)
        run: cd contenus && ROS_LAB_IMAGE=ros-lab:0.1.0 python -m pytest -v tests/test_testing.py tests/test_verification.py
      - name: Modules du parcours (bug présent, solution qui corrige, lab qui compile)
        run: ROS_LAB_IMAGE=ros-lab:0.1.0 python scripts/test_modules.py

  integration:
    needs: [unit, lab-ui, image]
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r hub/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lab-ui/package-lock.json
      - name: Playwright
        working-directory: lab-ui
        run: npm ci && npx playwright install --with-deps chromium
      - run: docker build -t ros-lab:0.1.0 images/ros-lab
      - name: Installation du serveur (scripts/installer-serveur.sh)
        run: |
          # comme sur un vrai serveur : paquets, pare-feu des labs, dossiers à quota (XFS), .env, démarrage
          sudo scripts/installer-serveur.sh --non-interactif --domaine localhost --admin admin-e2e@exemple.fr \
            --sans-smtp --sessions 35 --homes-taille 6G \
            --env VEILLE_SEUIL_DISQUE=1   # alerte de disque immédiate : vérifiée dans Loki par l'e2e
          sudo chown "$USER" deploy/.env   # lu par les étapes de test
          sudo iptables -C INPUT -i rl-+ -j DROP   # règle du pare-feu des labs posée
      - name: Site des formations prêt
        run: |
          for _ in $(seq 1 30); do curl -ksf https://localhost/ >/dev/null && curl -ksf https://localhost/connexion >/dev/null && exit 0; sleep 2; done
          exit 1
      - name: Suite principale
        run: |
          set -a; . deploy/.env; set +a
          cd tests/integration && python -m pytest -v -m "not limit and not cull"
      - name: Lab UI de bout en bout
        working-directory: lab-ui
        run: |
          set -a; . ../deploy/.env; set +a
          npx playwright test --grep-invert "@limit|@stripe"
      - name: Abonnement pro (Stripe simulé)
        run: |
          set -a; . deploy/.env; set +a
          (cd deploy && docker compose -f docker-compose.yml -f docker-compose.stripe-simule.yml up -d --build comptes fake-stripe)
          for _ in $(seq 1 30); do curl -sf -H "Authorization: Bearer sk_test_simule" http://localhost:12111/v1/prices/price_pro_test >/dev/null && curl -ksf https://localhost/connexion >/dev/null && break; sleep 2; done
          cd lab-ui && npx playwright test --grep @stripe
          cd ../deploy && docker compose up -d comptes   # retour à Comptes sans Stripe pour la suite
      - name: Capacité
        run: |
          set -a; . deploy/.env; set +a
          (cd deploy && ACTIVE_SERVER_LIMIT=2 docker compose up -d hub comptes)
          scripts/wait_for_hub.sh
          (cd tests/integration && python -m pytest -v -m limit)
          cd lab-ui && npx playwright test --grep @limit
      - name: Charge (réduite)
        run: |
          set -a; . deploy/.env; set +a
          (cd deploy && ACTIVE_SERVER_LIMIT=8 docker compose up -d hub comptes)
          scripts/wait_for_hub.sh
          python scripts/charge.py --sessions 8 --limite 8 --duree 30
      - name: Inactivité
        run: |
          set -a; . deploy/.env; set +a
          (cd deploy && IDLE_TIMEOUT_SECONDS=90 docker compose up -d hub)
          scripts/wait_for_hub.sh
          cd tests/integration && python -m pytest -v -m cull
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: lab-ui/playwright-report
          retention-days: 7
      - if: failure()
        run: |
          docker ps -a
          docker logs hub
          docker logs deploy-caddy-1 || true
          docker logs deploy-contenus-1 || true
          docker logs deploy-fake-stripe-1 || true
          for s in veille alloy loki grafana; do docker logs deploy-$s-1 2>&1 | tail -50 || true; done
          docker logs deploy-comptes-1 2>&1 | sed -E 's#/connexion/email/[^ ]+#/connexion/email/…#' || true
          for c in $(docker ps -aq --filter name=jupyter-); do docker logs "$c"; done
