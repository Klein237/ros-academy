{% extends "base.html" %}
{% block title %}Nouveau mot de passe{% endblock %}
{% block content %}
<section class="card login">
  <h1>Choisissez un nouveau mot de passe</h1>
  <p class="muted">Pour le compte {{ email }}. Les autres appareils connectés devront se reconnecter.</p>
  {% if erreur %}<p class="form-error" role="alert">{{ erreur }}</p>{% endif %}
  <form method="post" class="stack">
    <label>Nouveau mot de passe <span class="muted small">(10 caractères au moins)</span>
      <input type="password" name="mot_de_passe" required minlength="10" maxlength="200" autocomplete="new-password"></label>
    <button class="button primary" type="submit">Enregistrer et me connecter</button>
  </form>
</section>
{% endblock %}
