{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<section class="card login">
  <h1>Mot de passe oublié</h1>
  <p class="muted">Indiquez votre adresse : nous vous envoyons un lien pour choisir un nouveau mot de passe.</p>
  {% if erreur %}<p class="form-error" role="alert">{{ erreur }}</p>{% endif %}
  <form method="post" action="/connexion/oubli" class="stack">
    <input type="hidden" name="suite" value="{{ suite }}">
    <label>Adresse e-mail <input type="email" name="email" required autocomplete="email" value="{{ email or '' }}" placeholder="vous@exemple.fr"></label>
    <button class="button primary" type="submit">Recevoir le lien</button>
  </form>
  <p class="login-switch"><a href="/connexion?suite={{ suite | urlencode }}">Retour à la connexion</a></p>
</section>
{% endblock %}
