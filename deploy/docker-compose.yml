# Journaux Docker limités en taille sur le disque ; l'historique complet est dans Loki (30 jours).
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  hub:
    build: ../hub
    container_name: hub
    restart: unless-stopped
    <<: *logging
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY:?}
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:?}
      ROS_LAB_IMAGE: ${ROS_LAB_IMAGE:-ros-lab:0.1.0}
      ACTIVE_SERVER_LIMIT: ${ACTIVE_SERVER_LIMIT:-35}
      IDLE_TIMEOUT_SECONDS: ${IDLE_TIMEOUT_SECONDS:-1200}
      COMPTES_URL: http://comptes:8300   # quota de minutes vérifié avant chaque démarrage
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hub-data:/srv/hub/data
    networks: [public, ros-lab-net]

  contenus:
    build:
      context: ..
      dockerfile: contenus/Dockerfile
    restart: unless-stopped
    <<: *logging
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      ROS_LAB_IMAGE: ${ROS_LAB_IMAGE:-ros-lab:0.1.0}
      CONTENT_GIT_REMOTE: ${CONTENT_GIT_REMOTE:-}
      MODULE_TESTS: ${MODULE_TESTS:-docker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # tests des modules à la publication
      - contenus-data:/srv/contenus                 # dépôt Git du contenu
    networks: [public]

  comptes:
    build: ../comptes
    restart: unless-stopped
    <<: *logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      JWT_SECRET: ${JWT_SECRET:?}
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:?}
      DATABASE_URL: postgresql+psycopg://comptes:${POSTGRES_PASSWORD:?}@postgres:5432/comptes
      ACTIVE_SERVER_LIMIT: ${ACTIVE_SERVER_LIMIT:-35}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    networks: [public, data]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: comptes
      POSTGRES_DB: comptes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comptes -d comptes"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]

  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    <<: *logging
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./journaux/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [journaux]

  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    <<: *logging
    command: ["run", "--disable-reporting", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./journaux/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lecture des journaux des conteneurs
      - alloy-data:/var/lib/alloy/data
    networks: [journaux]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    <<: *logging
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN:-localhost}/admin/journaux/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # identité posée par Caddy après vérification de la session d'administrateur (Contenus)
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Academy-Admin
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/plateforme.json
    volumes:
      - ./journaux/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./journaux/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [public, journaux]

  veille:
    build: ../veille
    restart: unless-stopped
    <<: *logging
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VEILLE_SEUIL_CPU: ${VEILLE_SEUIL_CPU:-80}
      VEILLE_SEUIL_MEMOIRE: ${VEILLE_SEUIL_MEMOIRE:-80}
      VEILLE_SEUIL_DISQUE: ${VEILLE_SEUIL_DISQUE:-80}
      VEILLE_SERVICES: hub=http://hub:8000/hub/api,comptes=http://comptes:8300/connexion,contenus=http://contenus:8200/,loki=http://loki:3100/ready
    volumes:
      - /proc:/host/proc:ro   # CPU et mémoire de l'hôte
      - /:/host/root:ro       # occupation du disque de l'hôte
    networks: [public, journaux]

  caddy:
    build: ../lab-ui   # Caddy + Lab UI construit (servi sous /lab/)
    restart: unless-stopped
    <<: *logging
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [public]

networks:
  public: {}
  data:
    internal: true   # base de données joignable par Comptes seulement
  journaux:
    internal: true   # Loki n'est joignable que par Alloy, Grafana et la veille
  ros-lab-net:
    name: ros-lab-net
    internal: true   # pas de sortie Internet pour les conteneurs étudiants

volumes:
  hub-data: {}
  contenus-data: {}
  caddy-data: {}
  postgres-data: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
