services:
  hub:
    build: ../hub
    container_name: hub
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY:?}
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:?}
      ROS_LAB_IMAGE: ${ROS_LAB_IMAGE:-ros-lab:0.1.0}
      ACTIVE_SERVER_LIMIT: ${ACTIVE_SERVER_LIMIT:-35}
      IDLE_TIMEOUT_SECONDS: ${IDLE_TIMEOUT_SECONDS:-1200}
      COMPTES_URL: http://comptes:8300   # quota de minutes vérifié avant chaque démarrage
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hub-data:/srv/hub/data
    networks: [public, ros-lab-net]

  contenus:
    build:
      context: ..
      dockerfile: contenus/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      ROS_LAB_IMAGE: ${ROS_LAB_IMAGE:-ros-lab:0.1.0}
      CONTENT_GIT_REMOTE: ${CONTENT_GIT_REMOTE:-}
      MODULE_TESTS: ${MODULE_TESTS:-docker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # tests des modules à la publication
      - contenus-data:/srv/contenus                 # dépôt Git du contenu
    networks: [public]

  comptes:
    build: ../comptes
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      JWT_SECRET: ${JWT_SECRET:?}
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:?}
      DATABASE_URL: postgresql+psycopg://comptes:${POSTGRES_PASSWORD:?}@postgres:5432/comptes
      ACTIVE_SERVER_LIMIT: ${ACTIVE_SERVER_LIMIT:-35}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    networks: [public, data]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comptes
      POSTGRES_DB: comptes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comptes -d comptes"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]

  caddy:
    build: ../lab-ui   # Caddy + Lab UI construit (servi sous /lab/)
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [public]

networks:
  public: {}
  data:
    internal: true   # base de données joignable par Comptes seulement
  ros-lab-net:
    name: ros-lab-net
    internal: true   # pas de sortie Internet pour les conteneurs étudiants

volumes:
  hub-data: {}
  contenus-data: {}
  caddy-data: {}
  postgres-data: {}
