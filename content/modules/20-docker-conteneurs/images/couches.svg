<text class="t-gras" x="770.0" y="62.0" text-anchor="middle">supervision</text>
<rect class="capteur" x="690.0" y="76.0" width="160.0" height="64.0" rx="6"/>
<text class="t-gras" x="770.0" y="101.0" text-anchor="middle">couche d&#x27;écriture</text>
<text class="t-petit" x="770.0" y="122.0" text-anchor="middle">fichiers temporaires</text>
<rect class="boite" x="690.0" y="152.0" width="160.0" height="148.0" rx="6"/>
<text class="t-petit" x="770.0" y="190.0" text-anchor="middle">les couches</text>
