<text class="t-gras" x="565.0" y="101.0" text-anchor="middle">couche d&#x27;écriture</text>
<text class="t-petit" x="565.0" y="122.0" text-anchor="middle">journaux, /tmp</text>
<rect class="boite" x="485.0" y="152.0" width="160.0" height="148.0" rx="6"/>
<text class="t-petit" x="565.0" y="190.0" text-anchor="middle">les couches</text>
<text class="t-petit" x="565.0" y="208.0" text-anchor="middle">de l&#x27;image,</text>
<text class="t-petit" x="565.0" y="226.0" text-anchor="middle">partagées</text>
