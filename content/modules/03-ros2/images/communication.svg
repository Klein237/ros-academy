<text class="t-sur" x="38.0" y="48.0" text-anchor="start">TOPIC</text>
<text class="t-petit" x="38.0" y="68.0" text-anchor="start">un flux, sans réponse</text>
<rect class="fond" x="300.0" y="20.0" width="260.0" height="330.0" rx="12"/>
