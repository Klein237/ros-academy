questions:
  - id: source
    question: Après colcon build, ros2 run mon_pkg mon_noeud répond « Package 'mon_pkg' not found ». Quelle est la cause la plus probable ?
    choix:
      - texte: L'overlay du workspace n'a pas été sourcé (source install/setup.bash).
        correct: true
      - texte: Le nœud n'est pas déclaré dans setup.py.
      - texte: ROS 2 n'est pas installé.
    explication: Sans source install/setup.bash, ROS ne connaît que les packages de /opt/ros/humble. Un nœud non déclaré donne une autre erreur, « No executable found ».
  - id: workspace
    question: Quels dossiers colcon build crée-t-il à la racine du workspace ?
    choix:
      - texte: build
        correct: true
      - texte: install
        correct: true
      - texte: log
        correct: true
      - texte: src
    explication: src contient vos sources et existe avant la compilation ; build, install et log sont produits par colcon.
  - id: topic-vs-service
    question: Un capteur envoie une mesure 50 fois par seconde. Quel moyen de communication choisir ?
    choix:
      - texte: Un topic.
        correct: true
      - texte: Un service.
      - texte: Une action.
    explication: Un flux continu, sans réponse attendue, est le cas d'usage des topics.
  - id: action
    question: Qu'est-ce qu'une action apporte de plus qu'un service ?
    choix:
      - texte: Des feedbacks pendant l'exécution.
        correct: true
      - texte: La possibilité d'annuler le goal en cours.
        correct: true
      - texte: Une communication garantie plus rapide.
    explication: Une action est un goal, des feedbacks successifs et un résultat, avec annulation possible, adaptée aux tâches longues.
  - id: node-info
    question: Quelle commande affiche les topics, services et actions d'un nœud en cours d'exécution ?
    choix:
      - texte: ros2 node info /nom_du_noeud
        correct: true
      - texte: ros2 pkg executables nom_du_package
      - texte: ros2 topic list -t
    explication: node info décrit les connexions d'un nœud ; pkg executables liste seulement ce qu'un package peut lancer.
