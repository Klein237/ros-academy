<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">Le triangle de la cinématique inverse</title>
<desc id="d">La pince doit pointer vers le bas : le poignet se place donc à L3 au-dessus de la cible. Dans le plan du bras, il est à une distance horizontale u et une hauteur v de l&#x27;épaule. Le bras et l&#x27;avant-bras forment avec la droite épaule-poignet un triangle dont on connaît les trois côtés : la loi des cosinus donne l&#x27;angle du coude q2. L&#x27;angle de l&#x27;épaule q1 est la direction du poignet, atan2 de u et v depuis la verticale, moins l&#x27;angle que fait le bras avec cette direction. Le poignet compense pour que la somme des trois angles vaille pi, et la tourelle tourne de atan2 de y et x.</desc>
<style>
.fond { fill: #fbfaf6; stroke: #cfc8b8; stroke-width: 1.5; }
.grille { stroke: #ece8de; stroke-width: 1; }
.boite { fill: #ffffff; stroke: #cfc8b8; stroke-width: 1.5; }
.calcul { fill: #ecedf9; stroke: #3b4596; stroke-width: 2; }
