  .badge { fill: #9aa4f0; } .t-badge { fill: #0b0b0d; } .sep { stroke: #26272d; }
}
</style>
<defs>
<marker id="m-trait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="pointe" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="m-trajet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="trajet-pointe" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="m-vitesse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="vitesse-pointe" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="m-x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="px" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="m-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="py" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="fond" x="20.0" y="20.0" width="840.0" height="390.0" rx="12"/>
<text class="t-sur" x="38.0" y="48.0" text-anchor="start">LA CIBLE, VUE DANS LE PLAN DU BRAS</text>
<rect class="actionneur" x="62.0" y="378.0" width="96.0" height="22.0" rx="4"/>
<rect class="boite" x="84.0" y="340.0" width="52.0" height="38.0" rx="4"/>
<line class="trajet" x1="110.0" y1="340.0" x2="162.3" y2="193.0"/>
<line class="trajet" x1="162.3" y1="193.0" x2="292.0" y2="184.0"/>
<line class="vitesse" x1="292.0" y1="184.0" x2="292.0" y2="236.0"/>
<circle class="boite" cx="110.0" cy="340.0" r="9"/>
<circle class="roue" cx="110.0" cy="340.0" r="3"/>
<circle class="boite" cx="162.3" cy="193.0" r="9"/>
<circle class="roue" cx="162.3" cy="193.0" r="3"/>
<circle class="boite" cx="292.0" cy="184.0" r="9"/>
<circle class="roue" cx="292.0" cy="184.0" r="3"/>
<circle class="cir" cx="292.0" cy="236.0" r="6"/>
<line class="tirets" x1="110.0" y1="340.0" x2="292.0" y2="184.0"/>
<line class="tirets" x1="110.0" y1="340.0" x2="292.0" y2="340.0"/>
<line class="tirets" x1="292.0" y1="340.0" x2="292.0" y2="184.0"/>
<text class="t-math" x="201.0" y="360.0" text-anchor="middle">u</text>
<text class="t-math" x="304.0" y="302.0" text-anchor="start">v</text>
<text class="t-code" x="96.0" y="345.0" text-anchor="end">épaule</text>
<text class="t-code" x="150.3" y="183.0" text-anchor="end">coude</text>
<text class="t-code" x="306.0" y="176.0" text-anchor="start">poignet</text>
<text class="t-ambre" x="306.0" y="241.0" text-anchor="start">cible</text>
<text class="t-math" x="284.0" y="214.0" text-anchor="end">L3</text>
<path class="trait" d="M110.0 270.0 A70.0 70.0 0 0 1 163.1 294.4" marker-end="url(#m-trait)"/>
<text class="t-code" x="118.0" y="244.0" text-anchor="start">atan2(u, v)</text>
<rect class="boite" x="520.0" y="70.0" width="320.0" height="320.0" rx="10"/>
<text class="t-gras" x="538.0" y="98.0" text-anchor="start">1. Le poignet, au-dessus de la cible</text>
<text class="t-code" x="538.0" y="122.0" text-anchor="start">u = √(x² + y²) ; v = z + L3 − H</text>
<text class="t-gras" x="538.0" y="160.0" text-anchor="start">2. Le coude : loi des cosinus</text>
<text class="t-code" x="538.0" y="184.0" text-anchor="start">d = (u² + v² − L1² − L2²) / (2·L1·L2)</text>
<text class="t-code" x="538.0" y="206.0" text-anchor="start">q2 = acos(d) ; |d| &gt; 1 : trop loin</text>
<text class="t-gras" x="538.0" y="244.0" text-anchor="start">3. L&#x27;épaule</text>
<text class="t-code" x="538.0" y="268.0" text-anchor="start">q1 = atan2(u, v)</text>
<text class="t-code" x="572.0" y="290.0" text-anchor="start">− atan2(L2·sin q2, L1 + L2·cos q2)</text>
<text class="t-gras" x="538.0" y="328.0" text-anchor="start">4. Le poignet, pince vers le bas</text>
<text class="t-code" x="538.0" y="352.0" text-anchor="start">q3 = π − q1 − q2 ; q0 = atan2(y, x)</text>
</svg>
