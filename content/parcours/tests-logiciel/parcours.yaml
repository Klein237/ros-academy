titre: Tester et fiabiliser un logiciel robotique
description: >-
  Ce qu'on attend d'un développeur robotique en équipe : tester un nœud seul,
  tester plusieurs nœuds ensemble, rejouer des données enregistrées pour
  reproduire un bug, garder un code propre et faire tourner tout cela à chaque
  changement, en intégration continue. Sur le code du robot de livraison. Le
  parcours s'ouvre module par module : les tests unitaires d'abord, puis les
  tests d'intégration, le rejeu de données et l'intégration continue.
accroche: Tests unitaires et d'intégration, données rejouées, qualité du code et intégration continue.
fil_rouge: "Tester un nœud seul, puis tout le robot, avec des données rejouées."
notion: "Tests, qualité du code, intégration continue."
statut: disponible
niveau: intermediaire
ordre: 30
prix: 30
objectifs:
  - séparer le calcul d'un nœud ROS pour le tester seul
  - écrire des tests unitaires avec pytest, cas limites et tests paramétrés compris
  - lancer les tests d'un package avec colcon test
  - mesurer la qualité de ses tests avec des mutants
  - tester un nœud lancé pour de vrai avec launch_testing, paramètres et codes de sortie compris
  - enregistrer et rejouer des données avec ros2 bag pour reproduire un bug
  - transformer un bug corrigé en test de non-régression sur données enregistrées
  - faire tourner compilation et tests à chaque pull request avec GitHub Actions
prerequis:
  - Apprendre ROS 2 avec un robot mobile
outils:
  - pytest
  - launch_testing
  - ros2 bag
  - rosbag2_py
  - GitHub Actions
modules:
  - id: 40-tests-unitaires
    coef: 1
    partie: Tester le code
  - id: 41-tests-integration
    coef: 1
    partie: Tester le code
  - id: 42-rejeu-donnees
    coef: 1
    partie: Tester sur des données réelles
  - id: 43-integration-continue
    coef: 1
    partie: Automatiser
