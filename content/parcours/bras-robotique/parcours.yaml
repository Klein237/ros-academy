titre: Programmer un bras robotique avec ROS 2
description: >-
  Un bras qui trie les colis du robot de livraison. Vous le décrivez en URDF,
  calculez la position de sa pince (cinématique directe) et trouvez les angles
  qui l'amènent sur un colis (cinématique inverse). Le bras est simulé sans
  moteur physique et s'affiche en 3D dans votre navigateur. Les trajectoires,
  ros2_control et la séquence complète de prise et de dépose arrivent dans les
  prochains modules.
accroche: Décrire un bras en URDF et calculer sa cinématique, directe et inverse, en 3D dans le navigateur.
statut: disponible
niveau: intermediaire
ordre: 20
prix: 30
objectifs:
  - décrire un bras manipulateur et compter ses degrés de liberté
  - écrire la description URDF d'un bras et vérifier ses axes
  - calculer la position de la pince à partir des angles (cinématique directe)
  - trouver les angles qui amènent la pince sur une cible, et refuser les cibles impossibles
  - publier ces calculs dans des nœuds ROS 2 et les vérifier avec TF2
prerequis:
  - Apprendre ROS 2 avec un robot mobile
outils:
  - URDF
  - TF2
  - Python
  - Vue 3D
modules:
  - id: 30-bras-manipulateur
    coef: 1
    partie: Décrire le bras
  - id: 31-bras-urdf
    coef: 2
    partie: Décrire le bras
  - id: 32-cinematique-directe
    coef: 2
    partie: Cinématique
  - id: 33-cinematique-inverse
    coef: 3
    partie: Cinématique
