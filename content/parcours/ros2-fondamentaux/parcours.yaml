titre: ROS 2 Fondamentaux
description: >-
  Les bases de ROS 2 Jazzy, en pratique, autour d'un fil rouge : un robot de
  livraison à conduite différentielle. On commence par le robot lui-même et
  le terminal Linux, puis vous l'enrichissez module après module — nœud,
  service, action, description URDF, paramètres et fichiers launch, repères
  TF2, puis simulation dans Gazebo. Chaque module se termine par un QCM, et
  les modules pratiques par une vraie panne à diagnostiquer.
accroche: >-
  Nœuds, topics, services, actions, URDF, paramètres, TF2 et simulation dans
  Gazebo, autour d'un même robot que vous faites rouler.
statut: disponible
niveau: debutant
ordre: 10
objectifs:
  - comprendre l'architecture d'un robot mobile et le commander avec v et ω
  - utiliser le terminal Linux au quotidien
  - écrire des nœuds ROS 2 en Python et en C++
  - créer des services, des actions et des paramètres
  - décrire un robot en URDF et ses repères avec TF2
  - le simuler dans Gazebo et l'observer dans RViz
prerequis:
  - bases de Python
