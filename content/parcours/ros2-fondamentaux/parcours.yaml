    coef: 1
  - id: 02-noeud
    coef: 2
  - id: 03-service
    coef: 2
  - id: 04-action
    coef: 2
  - id: 05-urdf
    coef: 1
  - id: 06-parametres
    coef: 2
  - id: 07-tf2
    coef: 2
  - id: 08-gazebo
    coef: 2
