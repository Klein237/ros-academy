titre: Concevoir l'architecture d'un robot
description: >-
  Passer de « ça marche » à « c'est maintenable » : découper un robot en nœuds,
  définir ses propres messages, organiser son comportement avec des machines à
  états puis des arbres de comportement, gérer le démarrage et l'arrêt avec
  les nœuds à cycle de vie, et regrouper des nœuds par composition.
accroche: Découpage en nœuds, interfaces, machines à états et arbres de comportement.
